<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hercules">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Hercules — understand your body, measure your progress, build your potential.">
  <title>Hercules</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="src/design-system/tokens.css">
  <link rel="stylesheet" href="src/design-system/base.css">
  <link rel="stylesheet" href="src/design-system/components.css">
  <script type="importmap">
    { "imports": {
        "three": "./src/vendor/three/three.module.min.js",
        "three/addons/": "./src/vendor/three/addons/"
    } }
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript><p style="padding:24px;color:#fff">Hercules needs JavaScript enabled.</p></noscript>
  <script>
    // Boot guard: if the app fails to start (e.g. a bad update), show a repair
    // button instead of a black screen. Repair clears cached code, never your data.
    (function () {
      function show(msg) {
        if (window.__herculesBooted || document.getElementById('boot-fail')) return;
        var d = document.createElement('div');
        d.id = 'boot-fail';
        d.style.cssText = 'position:fixed;inset:0;display:grid;place-items:center;background:#000;color:#fff;font:17px -apple-system,system-ui,sans-serif;text-align:center;padding:32px;z-index:999';
        d.innerHTML = '<div><div style="font-weight:700;font-size:22px;margin-bottom:8px">Hercules needs a refresh</div><div style="color:#98989f;margin-bottom:20px">An update didn\'t load cleanly. Your data is safe.</div><button id="boot-fix" style="height:48px;padding:0 24px;border-radius:999px;border:0;background:#fff;color:#000;font:600 17px -apple-system,system-ui">Reload &amp; Repair</button><div style="color:#5d5d63;font-size:12px;margin-top:16px">' + (msg || '') + '</div></div>';
        document.body.appendChild(d);
        document.getElementById('boot-fix').onclick = async function () {
          try { var regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(function (r) { return r.unregister(); })); } catch (e) {}
          try { var keys = await caches.keys(); await Promise.all(keys.map(function (k) { return caches.delete(k); })); } catch (e) {}
          location.reload();
        };
      }
      window.__herculesBootError = function (e) { show(String(e && e.message || e)); };
      window.addEventListener('error', function (e) { if (!window.__herculesBooted) show(e.message); });
      window.addEventListener('unhandledrejection', function (e) { if (!window.__herculesBooted) show(String(e.reason && e.reason.message || e.reason)); });
      setTimeout(function () { if (!window.__herculesBooted) show('Startup timed out.'); }, 9000);
    })();
  </script>
  <script type="module" src="src/app/main.js"></script>
</body>
</html>
